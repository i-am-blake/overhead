name: Seed roster from GCAT

# Run by hand, occasionally. Downloads GCAT, finds every organization with a
# Washington operating location, and lists what they built.
#
# It writes CANDIDATES to data/gcat-washington.json and commits them. It does NOT
# touch roster.json — every attribution still needs a human decision.
#
# Data from GCAT (J. McDowell, planet4589.org/space/gcat), CC-BY.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find Washington builders
        run: node scripts/seed-from-gcat.mjs --print

      - name: Commit the candidate list
        run: |
          git config user.name  "overhead-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gcat-washington.json
          if git diff --staged --quiet; then
            echo "No change in the candidate list."
          else
            git commit -m "GCAT candidates $(date -u +%Y-%m-%d)"
            git push
          fi
