name: Refresh orbital elements

# Free on public repositories — GitHub does not bill Actions minutes for them.
#
# Note: scheduled workflows are disabled automatically after 60 days without
# repository activity. If this project sits idle between events, either push a
# commit or hit "Run workflow" to wake it up before you need it.

on:
  schedule:
    # 09:17 UTC daily. Deliberately not on the hour — every cron job on the
    # internet fires at :00, and CelesTrak is a nonprofit absorbing that.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-elements
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch current elements
        id: fetch
        run: node scripts/fetch-tles.mjs 2>&1 | tee /tmp/fetch.log

      - name: Commit if the elements changed
        run: |
          git config user.name  "overhead-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tles.json
          if git diff --staged --quiet; then
            echo "No change — CelesTrak returned the same elements."
          else
            git commit -m "Refresh orbital elements $(date -u +%Y-%m-%d)"
            git push
          fi

      # A refresh that fails quietly is worse than one that fails loudly: the page
      # keeps showing yesterday's sky and nobody notices until it is weeks old.
      - name: Open an issue if the refresh failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Orbital element refresh failed';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'refresh-failure'
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again on ${new Date().toISOString().slice(0,10)}. ${run}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, labels: ['refresh-failure'],
                body: `The daily CelesTrak refresh failed. The site is still serving the last good elements, which go stale within days.\n\nRun log: ${run}`
              });
            }
